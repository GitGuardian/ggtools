name: Install GitGuardian across the enterprise
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  install:
    # GitHub Enterprise Cloud: ubuntu-latest.
    # GitHub Enterprise Server: GitHub-hosted runners are not available, so use one of
    # your self-hosted runners (for example `runs-on: self-hosted`) with Python 3.10+.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      # GitHub Actions sets GITHUB_API_URL to the instance the workflow runs on
      # (https://api.github.com on Cloud, https://<ghes-host>/api/v3 on GHES),
      # so the script targets the right GitHub without extra configuration.
      - run: python3 gg_enterprise_installer.py --all-orgs
        env:
          GH_INSTALLER_CLIENT_ID: ${{ vars.GH_INSTALLER_CLIENT_ID }}
          GH_INSTALLER_PRIVATE_KEY: ${{ secrets.GH_INSTALLER_PRIVATE_KEY }}
          GH_ENTERPRISE_SLUG: ${{ vars.GH_ENTERPRISE_SLUG }}
          GG_APP_CLIENT_ID: ${{ vars.GG_APP_CLIENT_ID }}
